# Render Blueprint: creates the web service and its PostgreSQL database in one step.
services:
  - type: web
    name: ubl-permit-to-work-demo
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # One worker with several threads: the app serialises writes with an in-process lock.
    startCommand: gunicorn ptw.wsgi:application --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ubl-ptw-db
          property: connectionString
      # Optional, add later in the Render dashboard (Environment tab):
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
databases:
  - name: ubl-ptw-db
    plan: free
    databaseName: ptw
    user: ptw
