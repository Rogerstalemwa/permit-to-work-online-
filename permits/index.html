${p.reviewNotes&&p.reviewNotes.length?`<h2>Review history</h2><div class="c" style="padding:10px">${p.reviewNotes.map(r=>`<div style="padding:7px 0;border-bottom:1px solid var(--ln)"><b>${esc(r.role)} · ${esc(r.name)}</b><div class="mu">${fmt(r.ts)} · ${esc(r.decision||'Reviewed')}</div>${r.comment?`<div>${esc(r.comment)}</div>`:'<div class="mu">No additional comments.</div>'}<div class="mu">Full permit review acknowledged</div></div>`).join('')}</div>`:''}<h2>Permit issue</h2><table>${rows(p.sig,'Issue')}</table>${dtab}<h2>Permit return</h2><table>${rows(p.ret,'Return')}</table>${p.ret[0]&&p.ret[0].outcome?`<div class="mu">${esc(p.ret[0].outcome)}</div>`:''}</div>
<p class="no">${can?`<button class="b" onclick="act(${p.id},'${ph}')">${ph=='a'?'Review & approve':'Confirm return'}</button> `:n?`<span class="mu">Waiting for ${esc(names(p,n))} (${n}) to confirm ${ph=='a'?'the permit':'the return'}.</span> `:''}${can&&ph=='a'&&me.r!='Receiver'?`<button class="b s" style="color:var(--wr)" onclick="reviewAction(${p.id},'Returned for correction')">Return for correction</button> <button class="b s" onclick="reviewAction(${p.id},'Clarification requested')">Request clarification</button> `:''}${me.r=='Receiver'&&tos(p,'Receiver').includes(me.e)&&['correction','clarification'].includes(p.workflowState)?`<button class="b s" onclick="editReturnedPermit(${p.id})">Edit permit details</button> <button class="b" onclick="respondReview(${p.id})">${p.workflowState=='correction'?'Respond and resubmit':'Provide clarification'}</button> `:''}${canDay?`<button class="b" onclick="daySign(${p.id},'${dnext?dnext.date:''}')">Confirm daily update (${dnext?dnext.date:''})</button> `:''}${canNew?`<button class="b" onclick="dayNew(${p.id})">Start today's daily update</button> `:''}${canx?`<button class="b s" style="color:var(--wr)" onclick="cancelP(${p.id})">Cancel permit</button> `:''}${lifecycleButtons(p)}<button class="b s" onclick="printPermit(${p.id})">Print permit</button></p><div class="print-only mu" id="pstamp" style="text-align:center;margin-top:6px"></div></div>`}
let _po=[],_pt='';
function _pBefore(){_po=[];document.querySelectorAll('.permit-print details').forEach(d=>{_po.push([d,d.open]);d.open=true});const s=document.getElementById('pstamp');if(s)s.textContent='Printed '+new Date().toLocaleString()+' · scan the QR code to confirm this permit is current'}
function _pAfter(){_po.forEach(([d,o])=>{d.open=o});_po=[];if(_pt){document.title=_pt;_pt=''}}
window.addEventListener('beforeprint',_pBefore);window.addEventListener('afterprint',_pAfter);
function printPermit(id){const p=(db||[]).find(x=>x.id==id);_pt=document.title;if(p&&p.no)document.title='Permit '+p.no;_pBefore();print()}
const VT=location.pathname.startsWith('/verify/')?location.pathname.split('/')[2]:'';
async function loadPub(){const s=await api('/api/verify/'+VT);PUB=true;if(!s){me={r:'Viewer',e:'',n:'Visitor'};$('#who').innerHTML='';$('#app').innerHTML='<div class="c">This permit could not be found. The QR code may be damaged or from another system.</div>';return}
BASE=s.base||BASE;RAMS_ENABLED=s.rams_enabled===true;if(s.sites)STRUCT=s.sites;users=s.users;db=[s.permit];cur=s.permit.id;me={r:'Viewer',e:'',n:'Visitor'};view='card';draw()}
if(VT){loadPub();setInterval(loadPub,10000)}else{pull(true);setInterval(()=>{save();pull()},10000)}
